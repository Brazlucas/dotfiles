# Clássico — o visual original antes do cyberpunk (Darcula, sem vidro, tmux roxo, suvash)
name  = "classic"
label = "Clássico (original)"
kind  = "dark"

[colors]
bg      = "#2b2b2b"
bg_alt  = "#3c3f41"
bg_deep = "#3c3f41"
fg      = "#a9b7c6"
dim     = "#808080"
subtle  = "#808080"
delim   = "#a9b7c6"
line    = "#555555"
sel     = "#214283"
sel_fg  = "#a9b7c6"
accent1 = "#9876aa"
accent2 = "#6897bb"
red     = "#cc666e"
green   = "#6a8759"
yellow  = "#bbb529"
blue    = "#6897bb"
magenta = "#9876aa"
cyan    = "#629755"
white   = "#ffffff"
ansi    = ["#2b2b2b", "#cc666e", "#6a8759", "#bbb529", "#6897bb", "#9876aa", "#629755", "#a9b7c6"]
brights = ["#555555", "#ff6b68", "#a5c261", "#ffc66d", "#6d9cbe", "#b389c5", "#6eb26e", "#ffffff"]

[diff]
add    = "#294436"
change = "#1f3a5f"
delete = "#4a2a2a"
text   = "#214283"

[tabbar]
bg          = "#3c3f41"
active_bg   = "#2b2b2b"
active_fg   = "#a9b7c6"
inactive_bg = "#3c3f41"
inactive_fg = "#808080"
hover_bg    = "#4e5254"
hover_fg    = "#a9b7c6"

[mascot]
body        = "#ff6ec7"
caption     = "#6897bb"
caption_dim = "#808080"

[features]
glass       = false
opacity     = 1.0
fancy_tabs  = false
padding     = 8
font_size   = 11.0
line_height = 1.0
cursor      = "SteadyBlock"
tmux        = "classic"
neko        = false
zsh_theme   = "suvash"
nvim        = "wildcharm"
claude      = "dark-ansi"
colorize    = false          # LS_COLORS/eza, fzf, bat, delta, lazygit, btop, ripgrep, zsh plugins
pgcli_style = "default"
