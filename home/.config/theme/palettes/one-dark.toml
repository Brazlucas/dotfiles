# One Dark — Clássico do Atom: cinza-azulado com cores equilibradas
name  = "one-dark"
label = "One Dark"
kind  = "dark"

[colors]
bg      = "#282c34"
bg_alt  = "#2c313a"
bg_deep = "#21252b"
fg      = "#abb2bf"
dim     = "#5c6370"
subtle  = "#7f848e"
delim   = "#9da5b4"
line    = "#3e4451"
sel     = "#3e4451"
sel_fg  = "#abb2bf"
accent1 = "#c678dd"
accent2 = "#61afef"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"
ansi    = ["#282c34", "#e06c75", "#98c379", "#e5c07b", "#61afef", "#c678dd", "#56b6c2", "#abb2bf"]
brights = ["#5c6370", "#e06c75", "#98c379", "#e5c07b", "#61afef", "#c678dd", "#56b6c2", "#ffffff"]

[diff]
add    = "#3e4a42"
change = "#334659"
delete = "#4d3941"
text   = "#3e4451"

[tabbar]
bg          = "#21252b"
active_bg   = "#282c34"
active_fg   = "#61afef"
inactive_bg = "#21252b"
inactive_fg = "#5c6370"
hover_bg    = "#2c313a"
hover_fg    = "#c678dd"

[mascot]
body        = "#c678dd"
caption     = "#61afef"
caption_dim = "#5c6370"

[features]
glass       = true
opacity     = 0.80
fancy_tabs  = true
padding     = 0
font_size   = 11.5
line_height = 1.1
cursor      = "BlinkingBar"
frame       = { top = "#61afef", right = "#61afef", bottom = "#c678dd", left = "#c678dd" }
tmux        = "neon"
neko        = true
zsh_theme   = "theme-active"
nvim        = "generated"
claude      = "custom"
colorize    = true
pgcli_style = "one-dark"
