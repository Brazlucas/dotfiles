# Nord — Gelo ártico: azuis frios e pastéis
name  = "nord"
label = "Nord"
kind  = "dark"

[colors]
bg      = "#2e3440"
bg_alt  = "#3b4252"
bg_deep = "#272c36"
fg      = "#d8dee9"
dim     = "#616e88"
subtle  = "#7b88a1"
delim   = "#aeb7c8"
line    = "#434c5e"
sel     = "#434c5e"
sel_fg  = "#eceff4"
accent1 = "#81a1c1"
accent2 = "#88c0d0"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#ffffff"
ansi    = ["#3b4252", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0"]
brights = ["#4c566a", "#bf616a", "#a3be8c", "#ebcb8b", "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4"]

[diff]
add    = "#45504f"
change = "#3f4a5a"
delete = "#4b3d48"
text   = "#434c5e"

[tabbar]
bg          = "#272c36"
active_bg   = "#2e3440"
active_fg   = "#88c0d0"
inactive_bg = "#272c36"
inactive_fg = "#616e88"
hover_bg    = "#3b4252"
hover_fg    = "#81a1c1"

[mascot]
body        = "#81a1c1"
caption     = "#88c0d0"
caption_dim = "#616e88"

[features]
glass       = true
opacity     = 0.80
fancy_tabs  = true
padding     = 0
font_size   = 11.5
line_height = 1.1
cursor      = "BlinkingBar"
frame       = { top = "#88c0d0", right = "#88c0d0", bottom = "#81a1c1", left = "#81a1c1" }
tmux        = "neon"
neko        = true
zsh_theme   = "theme-active"
nvim        = "generated"
claude      = "dark-ansi"     # herda a paleta ANSI do terminal: acompanha o WezTerm ao vivo (custom = cores RGB fixas, só relidas ao reiniciar o Claude)
colorize    = true
pgcli_style = "nord"
