# Oxocarbon — Grafite da IBM Carbon, rosa e azul
name  = "oxocarbon"
label = "Oxocarbon"
kind  = "dark"

[colors]
bg      = "#161616"
bg_alt  = "#252626"
bg_deep = "#121212"
fg      = "#f2f4f8"
dim     = "#6f6f6f"
subtle  = "#aaabad"
delim   = "#cbcccf"
line    = "#393939"
sel     = "#393939"
sel_fg  = "#f2f4f8"
accent1 = "#ee5396"
accent2 = "#33b1ff"
red     = "#ee5396"
green   = "#42be65"
yellow  = "#ffe97b"
blue    = "#78a9ff"
magenta = "#be95ff"
