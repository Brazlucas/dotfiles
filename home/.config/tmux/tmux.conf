set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

unbind C-b
set -g prefix C-b
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Tema: arquivo gerado por `theme` a partir da paleta ativa (troque com `theme set <nome>`,
# Ctrl+Alt+G no WezTerm, prefixo+T aqui ou <leader>uz no nvim)
source-file ~/.config/theme/build/current/tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# (substituído pelo tema cyberpunk acima) set -g status-bg '#5f27cd'
# set -g status-bg '#CD2752'
# (tema cyberpunk define as cores) set -g status-fg white

# Yazi config
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
