set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

unbind C-b
set -g prefix C-b
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ───────── Cyberpunk theme ─────────
# paleta: bg #080b10 · painel #0d1117 · ciano #05f2ff · rosa #ff2a6d · roxo #b45cff · amarelo #fcee0a
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#06080c,fg=#5c6b80"
set -g status-left-length 40
set -g status-right-length 90

# esquerda: sessão
set -g status-left "#[bg=#ff2a6d,fg=#080b10,bold]  #S #[bg=#06080c,fg=#ff2a6d,nobold] "

# janelas
set -g window-status-separator ""
set -g window-status-format "#[bg=#06080c,fg=#5c6b80] #I #[fg=#5c6b80]#W "
set -g window-status-current-format "#[bg=#06080c,fg=#05f2ff]#[bg=#05f2ff,fg=#080b10,bold] #I  #W#{?window_zoomed_flag, 󰁌,} #[bg=#06080c,fg=#05f2ff,nobold]"
set -g window-status-activity-style "fg=#fcee0a"
set -g window-status-bell-style "fg=#ff2a6d,bold"

# direita: prefixo ativo · pasta · hora
set -g status-right "#{?client_prefix,#[bg=#fcee0a#,fg=#080b10#,bold]  PREFIX #[default] ,}#[fg=#ff2a6d]#[bg=#ff2a6d,fg=#080b10]  #{b:pane_current_path} #[bg=#ff2a6d,fg=#05f2ff]#[bg=#05f2ff,fg=#080b10,bold]  %H:%M "

# painéis: borda neon
set -g pane-border-style "fg=#1f2a37"
set -g pane-active-border-style "fg=#ff2a6d"
set -g pane-border-lines heavy
set -g display-panes-colour "#05f2ff"
set -g display-panes-active-colour "#ff2a6d"

# mensagens, modo cópia e relógio
set -g message-style "bg=#0d1117,fg=#05f2ff,bold"
set -g message-command-style "bg=#0d1117,fg=#ff2a6d,bold"
set -g mode-style "bg=#12404a,fg=#ffffff"
set -g clock-mode-colour "#05f2ff"

# nova janela (prefixo + c) mostra o gato
bind c new-window \; display-popup -E -T " #[fg=#ff2a6d,bold]neko " -w 44 -h 10 -b rounded -S "fg=#ff2a6d" -s "bg=#080b10" "zsh ~/.config/cyber/neko-popup.zsh"

# gato ASCII rosa ao anexar (qualquer tecla pula; desligue com NEKO_OFF=1)
set-hook -g client-attached 'display-popup -E -T " #[fg=#ff2a6d,bold]neko " -w 44 -h 10 -b rounded -S "fg=#ff2a6d" -s "bg=#080b10" "zsh ~/.config/cyber/neko-popup.zsh"'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# (substituído pelo tema cyberpunk acima) set -g status-bg '#5f27cd'
# set -g status-bg '#CD2752'
set -g status-fg white

# Yazi config
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
