set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

unbind C-b
set -g prefix C-b
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ───────── Cyberpunk theme ─────────
# paleta: bg #0a0817 · painel #120f26 · ciano #05f2ff · rosa #ff2a6d · roxo #c04dff · amarelo #fcee0a
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#06040f,fg=#6b5fa8"
set -g status-left-length 40
set -g status-right-length 90

# esquerda: sessão
set -g status-left "#[bg=#ff2a6d,fg=#0a0817,bold]  #S #[bg=#06040f,fg=#ff2a6d,nobold] "

# janelas
set -g window-status-separator ""
set -g window-status-format "#[bg=#06040f,fg=#6b5fa8] #I #[fg=#6b5fa8]#W "
set -g window-status-current-format "#[bg=#06040f,fg=#05f2ff]#[bg=#05f2ff,fg=#0a0817,bold] #I  #W#{?window_zoomed_flag, 󰁌,} #[bg=#06040f,fg=#05f2ff,nobold]"
set -g window-status-activity-style "fg=#fcee0a"
set -g window-status-bell-style "fg=#ff2a6d,bold"

# direita: prefixo ativo · pasta · hora
set -g status-right "#{?client_prefix,#[bg=#fcee0a#,fg=#0a0817#,bold]  PREFIX #[default] ,}#[fg=#c04dff]#[bg=#c04dff,fg=#0a0817]  #{b:pane_current_path} #[bg=#c04dff,fg=#05f2ff]#[bg=#05f2ff,fg=#0a0817,bold]  %H:%M "

# painéis: borda neon
set -g pane-border-style "fg=#2b1f55"
set -g pane-active-border-style "fg=#ff2a6d"
set -g pane-border-lines heavy
set -g display-panes-colour "#05f2ff"
set -g display-panes-active-colour "#ff2a6d"

# mensagens, modo cópia e relógio
set -g message-style "bg=#120f26,fg=#05f2ff,bold"
set -g message-command-style "bg=#120f26,fg=#ff2a6d,bold"
set -g mode-style "bg=#4a1d7a,fg=#ffffff"
set -g clock-mode-colour "#05f2ff"

# gato ASCII rosa ao anexar (qualquer tecla pula; desligue com NEKO_OFF=1)
set-hook -g client-attached 'display-popup -E -T " #[fg=#ff2a6d,bold]neko " -w 44 -h 10 -b rounded -S "fg=#ff2a6d" -s "bg=#0a0817" "zsh ~/.config/cyber/neko-popup.zsh"'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g status-bg '#5f27cd'
# set -g status-bg '#CD2752'
set -g status-fg white

# Yazi config
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
