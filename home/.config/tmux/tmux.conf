set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

unbind C-b
set -g prefix C-b
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Tema: lê ~/.config/cyber/state (on/off). Alterne com prefixo+T, Ctrl+Alt+G (WezTerm) ou <leader>uz (nvim).
if-shell '[ "$(cat /mnt/c/Users/blubs/.cyber_state 2>/dev/null)" = "off" ]' 'source-file ~/.config/tmux/classic.conf' 'source-file ~/.config/tmux/cyber.conf'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# (substituído pelo tema cyberpunk acima) set -g status-bg '#5f27cd'
# set -g status-bg '#CD2752'
# (tema cyberpunk define as cores) set -g status-fg white

# Yazi config
set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
